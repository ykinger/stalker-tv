services:
  portal:
    build:
      context: ../..
      dockerfile: tools/mock-portal/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      MOCK_MAC: "00:1A:79:00:00:01"
      PUBLIC_BASE_URL: "http://10.0.2.2:8080"
      TOKEN_TTL_SECONDS: "3600"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
